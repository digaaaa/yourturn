name: Publish and deploy

on:
  workflow_call:

jobs:
  publish:
    name: Publish SHA-tagged images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [chores, supplies]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: echo "tag=ghcr.io/${REPOSITORY,,}-$SERVICE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.tag }}
          build-args: APP_VERSION=${{ github.sha }}

  deploy:
    name: Deploy to Azure and verify live health
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: yourturn-azure
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Update both apps and publish the static site
        env:
          AZURE_PREFIX: ${{ vars.AZURE_PREFIX }}
          CHORES_DATABASE_URL: ${{ secrets.CHORES_DATABASE_URL }}
          SUPPLIES_DATABASE_URL: ${{ secrets.SUPPLIES_DATABASE_URL }}
        run: bash scripts/deploy-azure.sh
